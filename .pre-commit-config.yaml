ci:
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The log corpus is a megabyte of compressed test data and belongs here.
        exclude: "^corpus/benchmark_logs\\.tar\\.xz$"
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        # Example logs are verbatim solver output; keep them byte-identical.
        exclude: "^(example_logs|corpus)/"
      - id: mixed-line-ending
        exclude: "^(example_logs|corpus)/"
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # corpus.py and damage.py are helpers the tests import, not test modules.
        exclude: "^tests/(corpus|damage)\\.py$"
      - id: trailing-whitespace
        exclude: "^(example_logs|corpus)/"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.10
    hooks:
      # Keep uv.lock in step with pyproject.toml; the CI installs from the lock.
      - id: uv-lock

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: "^(example_logs|corpus)/"
        # "[sS]earch" in a regex character class is not a typo.
        args: ["-L", "earch"]
